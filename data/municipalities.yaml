# 自治体レジストリ (シード)
# code: 全国地方公共団体コード(5桁市区町村コード、最初の2桁が都道府県)
# name_aliases に正式名/別表記を入れて、住所/逆ジオコーディング結果から検索できるようにする
#
# disaster_plan_url は仕様§5.2 の Discovery 層 1 の「明示 pin」用。通常は browser-use Discovery
# が動的に解決するため空でよい。pin が必要な特殊ケース (PDF が深い階層にあって発見が不安定、
# あるいはオフライン demo で探索を完全 skip したい等) でのみ設定する。

